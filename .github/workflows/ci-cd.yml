name: CI/CD

# PR branch filters refer to the target branch. Merges also create main pushes.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      APP_ENV: testing
      APP_DEBUG: 'false'
      # Real environment variables override phpunit.xml's non-forced SQLite defaults.
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: ci-only-root-password
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: testing
          # Disposable CI credentials, never production credentials.
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    steps:
      # Immutable action revisions; update pins deliberately when upgrading.
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          # Approved change: committed Pest/PHPUnit/Symfony require PHP >=8.4.1.
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, curl, zip
          tools: composer:v2
          coverage: none

      - name: Locate Composer download cache
        id: composer-cache
        working-directory: api
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-php84-${{ hashFiles('api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-php84-

      - name: Set up Node.js and npm download cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            ui/package-lock.json

      - name: Prepare Laravel testing environment
        working-directory: api
        run: |
          cp .env.example .env
          # Persist the same database configuration for Artisan and test subprocesses.
          python3 - <<'PY'
          import os
          from pathlib import Path
          names = ('APP_ENV', 'APP_DEBUG', 'DB_CONNECTION', 'DB_HOST', 'DB_PORT',
                   'DB_DATABASE', 'DB_USERNAME', 'DB_PASSWORD', 'DB_URL',
                   'CACHE_STORE', 'SESSION_DRIVER', 'QUEUE_CONNECTION', 'MAIL_MAILER')
          path = Path('.env')
          lines = [line for line in path.read_text().splitlines()
                   if line.split('=', 1)[0] not in names]
          lines.extend(f'{name}={os.environ[name]}' for name in names)
          path.write_text('\n'.join(lines) + '\n')
          PY

      - name: Install backend dependencies and initialize database
        working-directory: api
        run: |
          composer validate --strict --no-check-publish
          composer install --prefer-dist --no-interaction --no-progress
          composer check-platform-reqs
          php artisan key:generate --force
          php artisan migrate --force --no-interaction

      # Laravel's welcome view also uses Vite assets, separate from the React app.
      - name: Build Laravel assets
        working-directory: api
        run: |
          npm ci --include=dev
          npm run build

      - name: Install and check React frontend
        working-directory: ui
        run: |
          npm ci --include=dev
          npm run lint --if-present
          # No test script exists yet; future tests must run once and exit in CI.
          npm test --if-present
          npx --no-install tsc --noEmit
          npm run build

      - name: Check backend formatting and run tests against MySQL
        working-directory: api
        run: |
          vendor/bin/pint --test
          php artisan test

  deploy:
    needs: build-and-test
    # Never deploy pull requests or develop pushes, even when CI succeeds.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    # Do not cancel an active deployment midway through migrations or installation.
    concurrency:
      group: nokify-production-deploy
      cancel-in-progress: false

    steps:
      - name: Validate deployment secrets
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          for name in SSH_HOST SSH_USERNAME SSH_PRIVATE_KEY SSH_HOST_FINGERPRINT; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done

      - name: Deploy verified commit over SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          port: 22
          envs: DEPLOY_SHA
          command_timeout: 35m
          # Contract: /var/www/nokify, systemd services and health URLs in DEPLOYMENT.md.
          # This is an in-place maintenance deployment, not zero downtime.
          script: |
            bash -se <<'DEPLOY'
            set -Eeuo pipefail
            cd /var/www/nokify

            # Also serialize manual deploys that use this same lock.
            exec 9>/var/www/nokify-deploy.lock
            flock -n 9 || { echo 'Another deployment holds the lock.'; exit 1; }
            test "$(git branch --show-current)" = main
            test -z "$(git status --porcelain)"
            test -f api/.env
            git fetch origin main
            if [[ "$(git rev-parse origin/main)" != "$DEPLOY_SHA" ]]; then
              echo 'Skipping superseded commit; a newer main push must pass CI.'
              exit 0
            fi
            git merge-base --is-ancestor HEAD "$DEPLOY_SHA"

            # Stop consumers before changing files. Failure leaves maintenance enabled.
            fail_deployment() {
              trap - ERR
              set +e
              php /var/www/nokify/api/artisan down --render="errors::503" --retry=60
              sudo -n systemctl stop nokify-ui.service nokify-queue.service
              echo 'Deployment failed. Inspect and recover using .github/DEPLOYMENT.md.' >&2
              exit 1
            }
            trap fail_deployment ERR
            php api/artisan down --render="errors::503" --retry=60
            sudo -n systemctl stop nokify-queue.service
            sudo -n systemctl stop nokify-ui.service
            git pull --ff-only origin main
            # Catch main advancing between fetch and pull; never activate untested code.
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

            cd api
            composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
            composer check-platform-reqs --no-dev
            # Clear stale configuration before migrations use the production environment.
            php artisan optimize:clear
            npm ci --include=dev
            npm run build
            cd ../ui
            npm ci --include=dev
            npm run build

            cd ../api
            # Use backward-compatible migrations and take backups before deployment.
            php artisan migrate --force --no-interaction
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart

            # Restart PHP to discard stale OPcache and Next.js to load the new build.
            sudo -n systemctl restart php8.4-fpm.service
            sudo -n systemctl start nokify-ui.service
            curl --fail --silent --show-error --retry 12 --retry-connrefused --retry-delay 5 --max-time 10 http://127.0.0.1:3000/ > /dev/null
            php artisan up
            # Any failure here re-enters maintenance and stops UI/workers via the trap.
            curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 3 --max-time 10 http://127.0.0.1:8080/up > /dev/null
            sudo -n systemctl start nokify-queue.service
            sudo -n systemctl is-active --quiet php8.4-fpm.service nokify-ui.service nokify-queue.service
            echo "Deployed $DEPLOY_SHA successfully."
            DEPLOY
